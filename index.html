*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:6px}
.tab{flex:1;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
main{padding:10px 12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.slot{display:flex;gap:10px;align-items:center;cursor:pointer}
.slot .ic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.slot .body{flex:1;min-width:0}
.slot .cat{font-size:12px;color:var(--hint)}
.slot .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .nm.empty{color:var(--accent)}
.price{font-weight:650;white-space:nowrap}
.sub{font-size:12px;color:var(--hint)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;background:var(--accent);color:var(--accent-text);cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.x{background:transparent;color:var(--hint);padding:4px 8px;font-size:18px;line-height:1}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.msg{font-size:13px;padding:8px 10px;border-radius:10px;margin-top:6px;display:flex;gap:8px}
.msg.error{background:rgba(214,69,69,.12);color:var(--err)}
.msg.warn{background:rgba(194,124,14,.12);color:var(--warn)}
.msg.info{background:rgba(47,111,237,.10);color:var(--accent)}
.msg.ok{background:rgba(31,157,85,.12);color:var(--ok)}
input[type=search],input[type=number],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item .nm{font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--hint)}
.tag.rec{background:rgba(123,79,224,.14);color:var(--rec);font-weight:600}
.tag.bad{background:rgba(214,69,69,.12);color:var(--err)}
.tag.note{background:rgba(194,124,14,.12);color:var(--warn)}
.why{font-size:12px;color:var(--rec);margin-top:3px}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:6}
.total{font-size:20px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.muted{color:var(--hint)}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
.toast.on{opacity:.92}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
label.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hint)}
pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:10px;margin:8px 0 0}
</style>
</head>

<script>
"use strict";
// ============================================================ data & settings
const ITEMS = DB.items;
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CATS = [
  ["cpu","Процессор","🧠"],["mb","Материнская плата","🧩"],["ram","Оперативная память","💾"],
  ["gpu","Видеокарта","🎮"],["ssd","SSD","⚡"],["hdd","HDD","🗄"],["cooler","Охлаждение CPU","❄️"],
  ["psu","Блок питания","🔌"],["case","Корпус","📦"]];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c[0], c[1]]));
const CAT_SHORT = {...CAT_NAME, mb:"Плата", ram:"Память", cooler:"Кулер"};
const FORM_RANK = {ITX:0, mATX:1, ATX:2, "E-ATX":3};
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pcb_"+k); return v == null ? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("pcb_"+k, JSON.stringify(v)); }catch(e){} }
};
let settings = Object.assign({markup:0, rate:0, showUsd:true}, store.get("settings", {}));
let build = store.get("build", {});      // cat -> {id, qty}
let purpose = store.get("purpose", "gaming");
for (const c in build) if (!BY_ID[build[c].id]) delete build[c];   // позиция ушла из прайса

const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

// ============================================================ helpers
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sell = p => p * (1 + (settings.markup||0)/100);
function money(usd){
  const v = sell(usd);
  const u = "$" + (Math.round(v*100)/100).toLocaleString("ru-RU");
  if (settings.rate > 0) {
    const s = Math.round(v*settings.rate/1000)*1000;
    return settings.showUsd ? `${s.toLocaleString("ru-RU")} сум · ${u}` : `${s.toLocaleString("ru-RU")} сум`;
  }
  return u;
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }
function save(){ store.set("build", build); }
const pm = m => String(m||"").replace("ryzen-","Ryzen ").replace(/^ultra(\d)-/,"Ultra $1 ").toUpperCase().replace("RYZEN","Ryzen").replace("ULTRA","Ultra");
const sel = c => build[c] ? BY_ID[build[c].id] : null;
const qty = c => build[c] ? (build[c].qty||1) : 0;
function norm(s){
  return s.toLowerCase().replace(/ё/g,"е").replace(/™/g,"")
    .replace(/(\d)\s*ти\b/g,"$1ti").replace(/\bти\b/g,"ti").replace(/\bгб\b/g,"gb").replace(/\bтб\b/g,"tb")
    .replace(/\bрайзен\b/g,"ryzen").replace(/\bинтел\b/g,"intel").replace(/\bкорпус\b/g,"корпус");
}
ITEMS.forEach(i => { const n = norm(i.name + " " + (i.article||"")); i._hay = n + " " + n.replace(/[\s\-_.]/g,""); });
function matches(i, q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  return toks.every(t => i._hay.includes(t) || i._hay.includes(t.replace(/[\-_.]/g,"")));
}
function tagsOf(i){
  const t = [];
  switch(i.cat){
    case "cpu": t.push(i.socket, `${i.cores||"?"} ядер`, `${i.tdp} Вт`, i.igpu ? "есть видеоядро" : "без видеоядра"); if(i.box_cooler) t.push("кулер в комплекте"); break;
    case "mb": t.push(i.socket, i.chipset||"", i.mem, i.form); if(i.wifi) t.push("Wi-Fi"); break;
    case "ram": t.push(i.mem, `${i.capacity} ГБ`, i.modules>1?`${i.modules}×${i.capacity/i.modules} ГБ`:"1 модуль", i.freq?`${i.freq} МГц`:""); break;
    case "gpu": t.push(i.vram?`${i.vram} ГБ`:"", `${i.tdp} Вт`, `БП от ${i.min_psu} Вт`); break;
    case "ssd": case "hdd": t.push(i.kind==="nvme"?"M.2 NVMe":i.kind==="sata"?"SATA 2.5\"":"HDD 3.5\"", i.capacity_gb>=1000?`${i.capacity_gb/1000} ТБ`:`${i.capacity_gb} ГБ`); break;
    case "psu": t.push(`${i.watts} Вт`, i.rating!=="Standard"?`80+ ${i.rating}`:"80+"); if(i.modular) t.push("модульный"); if(i.sfx) t.push("SFX"); break;
    case "cooler": t.push(i.liquid?`СЖО ${i.radiator||""}`:"башня/воздух", `до ${i.tdp_rating} Вт`); break;
    case "case": t.push(`до ${i.max_form}`); if(i.argb) t.push("ARGB"); break;
  }
  return t.filter(Boolean);
}

// ============================================================ engine: power & compatibility
function powerNeed(b){
  const cpu = b.cpu, gpu = b.gpu;
  const cpuW = cpu ? cpu.tdp : 125, gpuW = gpu ? gpu.tdp : 0;
  const draw = cpuW + gpuW + 60;
  let rec = Math.ceil(draw*1.3/50)*50;
  if (gpu) rec = Math.max(rec, gpu.min_psu);
  return {draw, rec: Math.max(rec, 450)};
}
function objBuild(){ const o={}; for (const c in build) o[c]=sel(c); o._ramQty = qty("ram"); return o; }

// hard: можно ли поставить item в текущую сборку b (без учёта занятой категории)
function hardIssues(item, b){
  const out = [];
  const cpu=b.cpu, mb=b.mb, ram=b.ram, cs=b.case, gpu=b.gpu, psu=b.psu;
  const sockOk = (c,m) => !c || !m || c.socket === m.socket;
  switch(item.cat){
    case "cpu":
      if (mb && !sockOk(item, mb)) out.push(`сокет ${item.socket} ≠ плата ${mb.socket}`);
      if (ram && !item.mem.includes(ram.mem)) out.push(`не поддерживает ${ram.mem}`);
      break;
    case "mb":
      if (cpu && !sockOk(cpu, item)) out.push(`сокет ${item.socket} ≠ CPU ${cpu.socket}`);
      if (ram && ram.mem !== item.mem) out.push(`плата под ${item.mem}, память ${ram.mem}`);
      if (cs && FORM_RANK[item.form] > FORM_RANK[cs.max_form]) out.push(`${item.form} не влезет в корпус (${cs.max_form})`);
      break;
    case "ram":
      if (mb && mb.mem !== item.mem) out.push(`плата под ${mb.mem}`);
      else if (!mb && cpu && !cpu.mem.includes(item.mem)) out.push(`${cpu.socket} работает с ${cpu.mem}`);
      break;
    case "case":
      if (mb && FORM_RANK[mb.form] > FORM_RANK[item.max_form]) out.push(`плата ${mb.form} не влезет`);
      break;
    case "cooler":
      if (cpu && !item.sockets.includes(cpu.socket)) out.push(`нет крепления ${cpu.socket}`);
      break;
    case "psu": {
      const need = powerNeed(b);
      if (item.watts < need.draw) out.push(`${item.watts} Вт < потребления ~${need.draw} Вт`);
      break; }
    case "gpu":
      if (psu && psu.watts < (b.cpu? b.cpu.tdp:125) + item.tdp + 60) out.push(`БП ${psu.watts} Вт не потянет`);
      break;
  }
  return out;
}

function checkBuild(){
  const b = objBuild(), res = [];
  const add = (level, text) => res.push({level, text});
  // попарная совместимость
  for (const c of ["mb","ram","case","cooler","psu"]) if (b[c]) {
    const tmp = Object.assign({}, b); delete tmp[c];
    hardIssues(b[c], tmp).forEach(t => add("error", `${CAT_NAME[c]}: ${t}`));
  }
  const {cpu, mb, ram, gpu, psu, cooler, ssd, hdd} = b;
  if (cpu && !gpu && !cpu.igpu) add("error", "У процессора нет встроенной графики — нужна видеокарта, иначе не будет изображения.");
  if (!cpu) add("info", "Начните с процессора — от него зависят плата, память и охлаждение.");
  if (ram) {
    const sticks = (ram.modules||1) * b._ramQty;
    const slots = mb ? (mb.form === "ITX" ? 2 : 4) : 4;
    if (sticks > slots) add("error", `Модулей памяти ${sticks}, а слотов на плате ${slots}.`);
    else if (sticks === 1) add("warn", "Один модуль памяти — одноканальный режим (−10…25% FPS). Лучше 2 одинаковые планки или комплект.");
    const totalGb = ram.capacity * b._ramQty;
    if (gpu && gpu.score >= 60 && totalGb < 32) add("info", `Для такой видеокарты в 2026 году комфортнее 32 ГБ ОЗУ (сейчас ${totalGb} ГБ).`);
    if (totalGb < 16) add("warn", `${totalGb} ГБ ОЗУ мало даже для офиса с браузером — минимум 16 ГБ.`);
  }
  if (cpu && mb && mb.tier === "entry" && cpu.tdp > 150) add("warn", `Плата на ${mb.chipset} с простым питанием — ${pm(cpu.model)} будет сбрасывать частоты под нагрузкой. Лучше B/Z-чипсет.`);
  if (cpu && mb && cpu.unlocked && cpu.socket.startsWith("LGA") && mb.tier !== "high") add("info", `Процессор с разблокированным множителем (K), но разгон доступен только на Z-чипсете.`);
  if (cpu && !cooler && !cpu.box_cooler) add("warn", "Процессор OEM — кулер в комплекте нет, добавьте охлаждение.");
  if (cpu && cooler && cooler.tdp_rating < cpu.tdp*0.85) add("warn", `Кулер рассчитан на ~${cooler.tdp_rating} Вт, а процессор греется до ${cpu.tdp} Вт — возможен перегрев/троттлинг.`);
  if (cpu && cpu.tdp >= 230 && cooler && !cooler.liquid) add("info", "Для такого CPU под длительной нагрузкой лучше СЖО 360 мм.");
  if (gpu || cpu) {
    const need = powerNeed(b);
    if (psu) {
      if (psu.watts >= need.draw && psu.watts < need.rec) add("warn", `Блок питания ${psu.watts} Вт впритык: потребление ~${need.draw} Вт, рекомендуем от ${need.rec} Вт.`);
    } else add("info", `Блок питания нужен от ${need.rec} Вт (потребление ~${need.draw} Вт).`);
  }
  if (cpu && gpu) {
    const r = gpu.score / cpu.score;
    if (r > 1.45) add("warn", `Процессор слабоват для ${gpu.chip?.toUpperCase()} — видеокарта будет недогружена. Рассмотрите CPU мощнее.`);
    else if (r < 0.5 && purpose === "gaming") add("info", "Видеокарта заметно слабее процессора — для игр выгоднее перераспределить бюджет в сторону GPU.");
  }
  if (!ssd && !hdd) add("warn", "Нет накопителя — добавьте SSD под систему.");
  if (!ssd && hdd) add("warn", "Система на HDD будет медленной — добавьте SSD.");
  if (ssd && mb && ssd.kind === "nvme" && false) {}
  if (!res.some(r => r.level==="error" || r.level==="warn") && Object.keys(build).length >= 6) add("ok", "Сборка совместима ✓");
  return res;
}

// ============================================================ engine: recommendations
function targetRamGb(b){
  if ((b.gpu && b.gpu.score >= 60) || (b.cpu && b.cpu.score >= 80) || purpose === "work") return 32;
  return 16;
}
// возвращает [{item, rank, why}] — меньше rank = лучше
function recommend(cat, b, mode, q){
  b = b || objBuild();
  mode = mode || "fit";            // fit — для подсказок, cheap — для сборки по бюджету
  q = q === undefined ? 1.5 : q;   // уровень качества «обвязки»: 0 — минимум, 1 — норм, 2+ — хорошая
  const pool = ITEMS.filter(i => i.cat === cat && hardIssues(i, b).length === 0);
  const out = [];
  if (cat === "ram") {             // одиночные планки предлагаем и парой (двухканал)
    pool.filter(i => (i.modules||1) === 1).forEach(i => out.push(scoreOne(i, 2)));
  }
  for (const i of pool) out.push(scoreOne(i, 1));
  out.sort((a,b2) => a.rank - b2.rank);
  return out;
  function scoreOne(i, n){
    let rank = 0, why = "";
    switch(cat){
      case "cpu": {
        if (b.gpu) { const t = b.gpu.score*0.9; rank = Math.abs(i.score - t)*2 + i.price/15; why = Math.abs(i.score - t) < 10 ? `в балансе с ${b.gpu.chip.toUpperCase()}` : ""; }
        else rank = i.price/15 - i.score*0.6;
        if (purpose === "office" && !i.igpu && !b.gpu) rank += 50;
        if (purpose === "office" && i.igpu && !b.gpu) why = why || "есть видеоядро — видеокарта не нужна";
        if (!i.igpu && !b.gpu) rank += 5;
        break; }
      case "gpu": {
        if (b.cpu) { const t = b.cpu.score*1.05; rank = Math.abs(i.score - t)*2 + i.price/40; why = Math.abs(i.score - t) < 12 ? `раскроется с ${pm(b.cpu.model)}` : ""; }
        else rank = i.price/40 - i.score*0.8;
        if (b.psu && i.min_psu > b.psu.watts) rank += 30;
        break; }
      case "mb": {
        rank = i.price;
        if (b.cpu) {
          if (i.tier === "entry" && b.cpu.tdp > 150) rank += 120;
          if (i.tier === "entry" && b.cpu.score >= 80) rank += 60;
          if (b.cpu.tdp >= 200 && i.price < 100 && !/i9/i.test(i.note||"")) rank += 80;   // бюджетные платы со слабым VRM
          if (b.cpu.unlocked && b.cpu.socket.startsWith("LGA") && i.tier === "high") { rank -= 25; why = "Z-чипсет — откроет разгон K-процессора"; }
          if (b.cpu.score >= 90 && i.tier === "high" && !b.cpu.socket.startsWith("LGA")) rank -= 20;
          if (!why) why = `${i.chipset} под ${pm(b.cpu.model)}`;
        }
        if (mode === "fit" && i.wifi) rank -= 8;
        break; }
      case "ram": {
        const tgt = mode === "cheap" && q < 1 ? 16 : targetRamGb(b);
        const cap = i.capacity*n, sticks = (i.modules||1)*n;
        rank = Math.abs(cap - tgt)*6 + i.price*n/8 - (sticks >= 2 ? 15 : 0);
        if (i.mem === "DDR5" && i.freq >= 6000) rank -= 4;
        if (cap < tgt) rank += 25;
        if (b.mb && b.mb.form === "ITX" && sticks > 2) rank += 999;
        why = cap === tgt ? `${tgt} ГБ${sticks>=2?", двухканальный режим":""}${n>1?" (2 планки)":""}` : "";
        break; }
      case "ssd": {
        const tgt = purpose === "office" ? 512 : 1000;
        rank = Math.abs(i.capacity_gb - tgt)/40 + i.price/6 - (i.kind === "nvme" ? 8 : 0);
        if (i.capacity_gb < 480) rank += 30;
        why = i.kind === "nvme" && Math.abs(i.capacity_gb - tgt) < 100 ? "NVMe — быстрая загрузка" : "";
        break; }
      case "hdd": rank = i.price/i.capacity_gb*1000; break;
      case "psu": {
        const need = powerNeed(b);
        if (i.watts < need.rec) { rank = 500 + (need.rec - i.watts); }
        else rank = i.price + (i.watts - need.rec)/8;
        if (need.rec >= 650 && (i.rating === "Gold" || i.rating === "Platinum")) rank -= mode === "fit" ? 25 : 8;
        if (i.rating === "Standard" && need.rec >= 550) rank += q >= 1 ? 80 : 30;
        if (q >= 1.8 && need.rec >= 650 && !(i.rating === "Gold" || i.rating === "Platinum")) rank += 40;
        why = i.watts >= need.rec ? `${i.watts} Вт с запасом (нужно от ${need.rec})` : "";
        break; }
      case "cooler": {
        const tdp = b.cpu ? b.cpu.tdp : 125;
        if (i.tdp_rating < tdp*0.9) rank = 500 + tdp - i.tdp_rating;
        else rank = i.price;
        if (q >= 1 && i.tdp_rating < Math.max(tdp*1.2, 150)) rank += 40;
        if (tdp >= 220 && !i.liquid) rank += 40;
        if (tdp >= 230 && i.liquid && i.radiator >= 360) rank -= 20;
        why = i.tdp_rating >= tdp ? `запас по TDP: ${i.tdp_rating} ≥ ${tdp} Вт` : "";
        break; }
      case "case": {
        rank = i.price - (i.argb ? 3 : 0);
        const minCase = q >= 2 ? 55 : q >= 1 ? 38 : 0;
        if (i.price < minCase) rank += 60;
        if (b.mb && b.mb.form === "ATX" && i.max_form === "ATX") rank -= 2;
        const whiteLike = ["mb","gpu","cooler","psu"].filter(c => b[c] && /white|wh\b|snow|ice/i.test(b[c].name)).length;
        if (whiteLike >= 2 && i.white) { rank -= 15; why = "в цвет к белым комплектующим"; }
        break; }
    }
    return {item:i, rank, why, qty:n};
  }
}

function autoComplete(){
  const order = ["cpu","gpu","mb","ram","ssd","cooler","psu","case"];
  let added = 0;
  for (const c of order) {
    if (build[c]) continue;
    const b = objBuild();
    if (c === "gpu" && purpose === "office" && b.cpu && b.cpu.igpu) continue;
    if (c === "cooler" && b.cpu && b.cpu.box_cooler) continue;
    const r = recommend(c, b)[0];
    if (r) { build[c] = {id:r.item.id, qty:r.qty||1}; added++; }
  }
  save(); return added;
}

// ============================================================ engine: budget builder
function cheapestRest(base, q){
  const b = Object.assign({}, base);
  for (const c of ["mb","ram","ssd","cooler","psu","case"]) {
    if (c === "cooler" && b.cpu.box_cooler) continue;
    const r = recommend(c, b, "cheap", q)[0];
    if (!r) return null;
    b[c] = r.item; if (c === "ram") b._ramQty = r.qty || 1;
  }
  return {b};
}
function costOf(b){ let s=0; for (const c in b) if (b[c] && b[c].price) s += b[c].price * (c === "ram" ? (b._ramQty||1) : 1); return s; }
function perf(cpu, gpu){
  if (purpose === "office") return Math.min(cpu.score, 60) - cpu.price/40;
  if (purpose === "work") return cpu.score*0.6 + (gpu? gpu.score*0.4 : 0);
  const g = gpu ? gpu.score : 8;
  const eff = Math.min(g, cpu.score*1.3);
  return eff*0.8 + cpu.score*0.2;
}
function budgetBuild(budgetUsdSell){
  const budget = budgetUsdSell / (1 + (settings.markup||0)/100);
  const cpus = ITEMS.filter(i => i.cat === "cpu");
  let gpus = [null];
  if (purpose !== "office") {
    const byChip = {};
    ITEMS.filter(i => i.cat === "gpu").forEach(g => { if (!byChip[g.chip] || byChip[g.chip].price > g.price) byChip[g.chip] = g; });
    gpus = Object.values(byChip);
    gpus.push(null);   // запасной вариант без видеокарты, если на дискретную не хватает
  }
  let best = null;
  const q = Math.min(2.5, budget/800);
  for (const cpu of cpus) for (const gpu of gpus) {
    if (!gpu && !cpu.igpu) continue;
    if (cpu.price + (gpu ? gpu.price : 0) > budget*0.85) continue;
    const base = {cpu, _ramQty:1}; if (gpu) base.gpu = gpu;
    const r = cheapestRest(base, q);
    if (!r) continue;
    const total = costOf(r.b);
    if (total > budget) continue;
    const p = perf(cpu, gpu) - total/budget*3;   // при близкой скорости — дешевле
    if (!best || p > best.p) best = {p, b:r.b, total};
  }
  if (!best && purpose === "gaming") {   // на игровую не хватает — пробуем без дискретной видеокарты
    purpose = "office"; const r = budgetBuild(budgetUsdSell); purpose = "gaming"; return r;
  }
  if (!best) return null;
  // докупаем на остаток: память, SSD, БП Gold, кулер/корпус
  const b = best.b;
  const upgrade = (c, filterFn) => {
    const cur = b[c]; const curCost = cur ? cur.price*(c==="ram"?b._ramQty:1) : 0;
    const left = budget - costOf(b) + curCost;
    const cands = recommend(c, Object.assign({}, b, {[c]: undefined}), "fit", q + 0.5)
      .filter(x => x.item.price*(x.qty||1) <= left && (!filterFn || filterFn(x.item, cur, x)));
    if (cands.length) { b[c] = cands[0].item; if (c === "ram") b._ramQty = cands[0].qty||1; }
  };
  upgrade("ram", (i, cur, x) => !cur || i.capacity*x.qty >= cur.capacity*b._ramQty);
  upgrade("ssd", (i, cur) => !cur || i.capacity_gb >= cur.capacity_gb);
  upgrade("psu", (i, cur) => !cur || i.watts >= cur.watts);
  upgrade("mb");
  if (b.cooler) upgrade("cooler", (i, cur) => i.tdp_rating >= cur.tdp_rating);
  upgrade("case");
  const nb = {};
  for (const c of ["cpu","mb","ram","gpu","ssd","cooler","psu","case"]) if (b[c]) nb[c] = {id:b[c].id, qty: c === "ram" ? b._ramQty : 1};
  return {build: nb, total: costOf(b), left: budget - costOf(b)};
}

function buildText(){

      ${i ? `<div style="text-align:right">
          <div class="price">${money(i.price*qty(c))}</div>
          ${c==="ram"||c==="ssd"||c==="hdd" ? `<div class="qty" data-noclick="1"><button data-q="${c}" data-d="-1">−</button><span>${qty(c)}</span><button data-q="${c}" data-d="1">+</button></div>` : ""}
        </div><button class="btn x" data-del="${c}" title="Убрать">×</button>` : ""}
    </div>`;
  });
  html += `</div>`;
  const checks = checkBuild();
  html += `<div class="card"><div class="row"><b class="grow">Проверка совместимости</b></div>${checks.map(msgHtml).join("") || '<div class="sub">Добавьте комплектующие.</div>'}</div>`;
  html += `<div class="row" style="gap:8px">
     <button class="btn grow" id="b-auto">✨ Подобрать недостающее</button>
     <button class="btn ghost" id="b-clear">Очистить</button></div>`;
  html += `<p class="sub">Цены — оптовые из прайса ${esc(DB.generated.slice(0,10))}${settings.markup?`, наценка ${settings.markup}%`:""}. Позиции без цены в прайсе считаются отсутствующими и не показываются.</p>`;
  el.innerHTML = html;
}

function itemRow(i, recInfo, issues, rankIdx){
  const isSel = build[i.cat] && build[i.cat].id === i.id;
  const tags = tagsOf(i).map(t => `<span class="tag">${esc(t)}</span>`);
  if (rankIdx !== undefined && rankIdx < 3 && !issues.length) tags.unshift(`<span class="tag rec">★ рекомендуем</span>`);
  if (i.note) tags.push(`<span class="tag note">${esc(i.note)}</span>`);
  issues.forEach(t => tags.push(`<span class="tag bad">${esc(t)}</span>`));
  return `<div class="item">
    <div class="grow"><div class="nm">${esc(i.name)}</div><div class="tags">${tags.join("")}</div>
      ${recInfo && recInfo.why && rankIdx < 3 ? `<div class="why">${esc(recInfo.why)}</div>` : ""}</div>
    <div style="text-align:right;flex:none"><div class="price">${money(i.price)}</div>
      ${recInfo && recInfo.qty > 1 && !isSel ? `<div class="sub">×2 = ${money(i.price*2)}</div>` : ""}
      <button class="btn small ${isSel?"ghost":""}" data-add="${i.id}" ${recInfo && recInfo.qty>1 ? 'data-qty="2"' : ""} style="margin-top:6px">${isSel?"✓ выбрано":recInfo && recInfo.qty>1?"Взять 2 шт":"Выбрать"}</button></div>
  </div>`;
}

function renderPick(){
  const el = $("#v-pick"), c = pickCat;
  const b = objBuild(); const cur = b[c]; delete b[c];
  const recs = recommend(c, b);
  const recIdx = new Map(), recMap = new Map();
  recs.forEach((r,k) => { if (!recIdx.has(r.item.id)) { recIdx.set(r.item.id, k); recMap.set(r.item.id, r); } });
  let list = ITEMS.filter(i => i.cat === c && (!pickQuery || matches(i, pickQuery)));
  if (pickOnlyOk) list = list.filter(i => recIdx.has(i.id));
  if (pickSort === "rec") list.sort((x,y) => (recIdx.has(x.id)?recIdx.get(x.id):1e6) - (recIdx.has(y.id)?recIdx.get(y.id):1e6) || x.price - y.price);
  if (pickSort === "asc") list.sort((x,y) => x.price - y.price);
  if (pickSort === "desc") list.sort((x,y) => y.price - x.price);
  const total = ITEMS.filter(i => i.cat === c).length;
  el.innerHTML = `
    <div class="row" style="margin-bottom:8px"><button class="btn ghost small" id="b-back">‹ Назад</button><b class="grow">${CAT_NAME[c]}</b><span class="sub">${list.length} из ${total}</span></div>
    <input type="search" id="pick-q" placeholder="Поиск: модель, бренд, артикул…" value="${esc(pickQuery)}">
    <div class="chips">
      <button class="chip ${pickSort==="rec"?"on":""}" data-sort="rec">★ Подходящие</button>
      <button class="chip ${pickSort==="asc"?"on":""}" data-sort="asc">Дешевле</button>
      <button class="chip ${pickSort==="desc"?"on":""}" data-sort="desc">Дороже</button>
      <label class="sw"><input type="checkbox" id="pick-ok" ${pickOnlyOk?"checked":""}> только совместимые</label>
    </div>
    <div class="card" id="pick-list">${list.slice(0,150).map(i => itemRow(i, recMap.get(i.id), hardIssues(i, b), pickSort==="rec" && !pickQuery ? recIdx.get(i.id) : undefined)).join("") || '<div class="sub">Ничего не найдено. Снимите фильтр «только совместимые» или измените запрос.</div>'}</div>`;
  const q = $("#pick-q");
  q.oninput = () => { pickQuery = q.value; const pos = q.selectionStart; renderPick(); const n=$("#pick-q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
  $("#pick-ok").onchange = e => { pickOnlyOk = e.target.checked; renderPick(); };
}

let searchQ = "";
function renderSearch(){
  const el = $("#v-search");
  const b = objBuild();
  const list = searchQ.trim().length >= 2 ? ITEMS.filter(i => matches(i, searchQ)).sort((x,y) => x.cat.localeCompare(y.cat) || x.price - y.price) : [];
  el.innerHTML = `<input type="search" id="s-q" placeholder="Например: 5060 ti 16, 7500f, b760m ddr4, 850w gold" value="${esc(searchQ)}">
    <p class="sub">Поиск по всему прайсу: ${ITEMS.length} позиций с ценой.</p>
    <div class="card">${list.slice(0,120).map(i => { const tmp = Object.assign({}, b); delete tmp[i.cat];
       return `<div class="sub" style="margin-top:6px">${CAT_NAME[i.cat]}</div>` + itemRow(i, null, hardIssues(i, tmp)); }).join("") || '<div class="sub">Введите хотя бы 2 символа.</div>'}</div>`;
  const q = $("#s-q");
  q.oninput = () => { searchQ = q.value; const pos=q.selectionStart; renderSearch(); const n=$("#s-q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
}

let budgetVal = store.get("budget", 1000), budgetRes = null;
function renderBudget(){
  const el = $("#v-budget");
  const unit = settings.rate > 0 ? "сум" : "$";
  const shown = settings.rate > 0 ? Math.round(budgetVal*settings.rate) : budgetVal;
  const chips = [["gaming","🎮 Игровой"],["office","🗂 Офис"],["work","🛠 Работа"]]
    .map(([k,t]) => `<button class="chip ${purpose===k?"on":""}" data-purpose="${k}">${t}</button>`).join("");
  let html = `<div class="card"><b>Сборка под бюджет</b>
    <p class="sub">Подберу самое производительное сочетание процессора и видеокарты, на которое хватает денег, остальное — совместимое и с запасом по питанию.</p>
    <div class="chips">${chips}</div>
    <div class="row"><input type="number" id="bud" min="150" step="${unit==="$"?50:500000}" value="${shown}"><span class="muted">${unit}</span></div>
    <div class="chips">${(unit==="$"?[400,600,800,1000,1500,2000,3000]:[5e6,8e6,12e6,15e6,20e6,30e6]).map(v=>`<button class="chip" data-bq="${v}">${unit==="$"?"$"+v:(v/1e6)+" млн"}</button>`).join("")}</div>
    <button class="btn" id="b-bud" style="width:100%">Собрать</button></div>`;
  if (budgetRes === false) html += `<div class="msg error">Не получилось уложиться: даже минимальная совместимая сборка дороже. Увеличьте бюджет.</div>`;
  else if (budgetRes) {
    html += `<div class="card"><b>Результат: ${money(budgetRes.total)}</b> <span class="sub">остаток ${money(Math.max(0,budgetRes.left))}</span>`;
    for (const [c,name] of CATS) { const it = budgetRes.build[c] && BY_ID[budgetRes.build[c].id]; if (!it) continue;
      html += `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="grow"><div class="sub">${name}</div><div style="font-size:14px">${esc(it.name)}${budgetRes.build[c].qty>1?` <b>×${budgetRes.build[c].qty}</b>`:""}</div></div><div class="price">${money(it.price*(budgetRes.build[c].qty||1))}</div></div>`; }
    html += `<button class="btn" id="b-apply" style="width:100%;margin-top:10px">Взять в сборку и доработать</button></div>`;
  }
  el.innerHTML = html;
  $("#b-bud").onclick = () => {
    const v = +$("#bud").value; if (!(v > 0)) return;
    budgetVal = settings.rate > 0 ? v/settings.rate : v; store.set("budget", budgetVal);
    budgetRes = budgetBuild(budgetVal) || false; renderBudget();
  };
  if ($("#b-apply")) $("#b-apply").onclick = () => { build = budgetRes.build; save(); toast("Сборка перенесена"); show("build"); };
}

function renderSettings(){
  $("#v-settings").innerHTML = `<div class="card"><b>Цены</b>
    <p class="sub">В прайсе оптовые цены в $. Можно добавить наценку и показывать в сумах по вашему курсу (оплата в прайсе — в сумах по коммерческому курсу ЦБ).</p>
    <label class="sub">Наценка, %</label><input type="number" id="st-m" value="${settings.markup}" min="0" step="1">
    <label class="sub" style="display:block;margin-top:8px">Курс, сум за $1 (0 — показывать только $)</label><input type="number" id="st-r" value="${settings.rate}" min="0" step="10">
    <label class="sw" style="margin-top:8px"><input type="checkbox" id="st-u" ${settings.showUsd?"checked":""}> показывать $ рядом с сумами</label>
    <button class="btn" id="st-save" style="width:100%;margin-top:10px">Сохранить</button></div>
    <div class="card"><b>База</b><p class="sub">Прайс: ${esc(DB.source)}<br>Обновлено: ${esc(DB.generated.replace("T"," "))}<br>
    ${CATS.map(([c,n]) => `${n}: ${ITEMS.filter(i=>i.cat===c).length}`).join(" · ")}</p></div>`;
  $("#st-save").onclick = () => { settings.markup = +$("#st-m").value||0; settings.rate = +$("#st-r").value||0; settings.showUsd = $("#st-u").checked; store.set("settings", settings); toast("Сохранено"); render(); };
}

// ============================================================ events
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-pick],[data-add],[data-del],[data-q],[data-sort],[data-purpose],[data-bq],#b-back,#b-auto,#b-clear,#b-copy,#b-send");
  if (!t) return;
  if (t.dataset.tab) { show(t.dataset.tab); return; }
  if (t.dataset.q) { e.stopPropagation(); const c=t.dataset.q; build[c].qty = Math.max(1, Math.min(4, qty(c) + (+t.dataset.d))); save(); render(); return; }
  if (t.dataset.del) { e.stopPropagation(); delete build[t.dataset.del]; save(); render(); return; }
  if (t.dataset.pick) { if (e.target.closest("[data-noclick]")) return; pickCat = t.dataset.pick; pickQuery = ""; pickSort = "rec"; pickOnlyOk = true; show("pick"); return; }
  if (t.dataset.add) { const i = BY_ID[t.dataset.add]; const q2 = +(t.dataset.qty||0);
    build[i.cat] = {id:i.id, qty: q2 || (build[i.cat] && build[i.cat].id===i.id ? qty(i.cat) : 1)}; save();
    toast(`${CAT_NAME[i.cat]}: выбрано`); if (view === "pick") show("build"); else render(); return; }
  if (t.dataset.sort) { pickSort = t.dataset.sort; renderPick(); return; }
  if (t.dataset.purpose) { purpose = t.dataset.purpose; store.set("purpose", purpose); budgetRes = null; render(); return; }
  if (t.dataset.bq) { $("#bud").value = t.dataset.bq; $("#b-bud").click(); return; }
  if (t.id === "b-back") { show("build"); return; }
  if (t.id === "b-auto") { const n = autoComplete(); toast(n ? `Добавлено: ${n}` : "Всё уже выбрано"); render(); return; }
  if (t.id === "b-clear") { build = {}; save(); render(); return; }
  if (t.id === "b-copy") { copyText(); return; }
  if (t.id === "b-send") { sendBuild(); return; }
});
function copyText(){
  const txt = buildText();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast("Скопировано"), ()=>showText(txt));
  else showText(txt);
}
function showText(txt){ $("#v-build").insertAdjacentHTML("afterbegin", `<div class="card"><b>Текст сборки</b><pre>${esc(txt)}</pre></div>`); show("build"); }
async function sendBuild(){
  if (!Object.keys(build).length) { toast("Сборка пустая"); return; }
  if (sendBuild.busy) return;
  const txt = buildText();
  if (tg && tg.initData) {
    sendBuild.busy = true;
    toast("Отправляем…");
    try {
      const r = await fetch("/api/build", {method:"POST", headers:{"Content-Type":"application/json", "X-Init-Data":tg.initData}, body:JSON.stringify(buildData())});
      if (r.ok) { tg.close(); return; }
    } catch(e){} finally { sendBuild.busy = false; }
    const payload = JSON.stringify({type:"pc_build", items:Object.entries(build).map(([c,v]) => ({cat:c, id:v.id, name:BY_ID[v.id].name, qty:v.qty||1, price:BY_ID[v.id].price})), total_usd: totalUsd(), markup: settings.markup});
    try { if (payload.length < 4000 && tg.initDataUnsafe && !tg.initDataUnsafe.query_id) { tg.sendData(payload); return; } } catch(e){}
    try { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(" ") + "&text=" + encodeURIComponent(txt)); return; } catch(e){}
  }
  copyText();
}
if (tg) { try { tg.MainButton.onClick(sendBuild); tg.BackButton.onClick(() => show("build")); } catch(e){} }
$("#dbdate").textContent = "· прайс " + DB.generated.slice(0,10);
show("build");
</script>
</body>
</html>
